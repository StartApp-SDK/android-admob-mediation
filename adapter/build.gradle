plugins {
    id 'com.android.library'
}

android {
    namespace = 'com.startapp.mediation.admob'

    compileSdk = 37

    defaultConfig {
        minSdk = 24
        targetSdk = 37

        aarMetadata {
            minCompileSdk = 36
        }
    }

    defaultConfig {
        buildConfigField 'String', 'VERSION_NAME', "\"$versionName\""
    }

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    api 'com.google.android.gms:play-services-ads:[24,26)'
    api 'com.startapp:inapp-sdk:[5.5.1,6)'
}

apply from: "$rootDir/sonatype-central-publish.gradle"
